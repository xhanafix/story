<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StorySell - Authentic Social Content Creator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" type="module" defer></script>
</head>
<body>
    <main class="container">
        <header class="header">
            <h1 class="header__title">StorySell</h1>
            <p class="header__subtitle">Authentic Social Content Creator</p>
        </header>

        <section class="form-section">
            <form id="post-form" class="post-form">
                <p class="form-description">Create authentic, non-promotional social content that subtly incorporates your key facts into engaging stories.</p>
                
                <div class="form-group">
                    <label for="platform" class="form-label">Platform</label>
                    <select id="platform" name="platform" class="form-select" required>
                        <option value="" disabled selected>Select a platform</option>
                        <option value="Facebook">Facebook</option>
                        <option value="Instagram">Instagram</option>
                        <option value="TikTok">TikTok</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="topic" class="form-label">Topic or Product Name</label>
                    <input type="text" id="topic" name="topic" class="form-input" placeholder="What are you promoting?" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Key Facts (3-5 bullet points)</label>
                    <div id="facts-container" class="facts-container">
                        <div class="fact-item">
                            <input type="text" class="form-input fact-input" placeholder="Enter a key fact" required>
                            <button type="button" class="btn btn-small btn-remove" disabled>✕</button>
                        </div>
                        <div class="fact-item">
                            <input type="text" class="form-input fact-input" placeholder="Enter a key fact" required>
                            <button type="button" class="btn btn-small btn-remove">✕</button>
                        </div>
                    </div>
                    <button type="button" id="add-fact" class="btn btn-secondary btn-small">+ Add another fact</button>
                </div>

                <div class="form-group">
                    <label for="language" class="form-label">Language</label>
                    <select id="language" name="language" class="form-select" required>
                        <option value="English">English</option>
                        <option value="Bahasa Malaysia">Bahasa Malaysia</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" id="generate-btn" class="btn btn-primary">Create Authentic Content</button>
                </div>
            </form>
        </section>

        <section id="result-section" class="result-section hidden">
            <h2 class="section-title">Your Authentic Content</h2>
            <div class="result-container">
                <div id="post-content" class="post-content"></div>
                <button id="copy-btn" class="btn btn-secondary">Copy to Clipboard</button>
            </div>
        </section>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Generating your post...</p>
        </div>
    </main>

    <footer class="footer">
        <p>StorySell Social Post Generator | <a href="https://github.com/your-username/storysell" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>
</body>
</html>
